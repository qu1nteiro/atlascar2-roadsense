# Windows / macOS (Docker Desktop) version of compose.yaml.
# There is no real "host" network: containers stay on Docker's bridge network
# and the Foxglove port is published to Windows. No rviz service.
#   $env:COMPOSE_FILE = "compose.windows.yaml"   (once per terminal)
#   docker compose --profile simulado --profile foxglove up
# If you change a service in compose.yaml, change it here too.

x-ros: &ros
  build: .
  image: va/${GRUPO:-g03}:latest
  network_mode: bridge
  ipc: host
  stop_signal: SIGINT
  environment:
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
    - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
  volumes:
    - ./data:/data

services:
  simulador:
    <<: *ros
    profiles: [simulado]
    command: >
      ros2 run va_g03 fake_scan --ros-args
      --params-file /ws/install/va_g03/share/va_g03/config/params.yaml

  reprodutor:
    <<: *ros
    profiles: [reproduzir]
    command: >
      ros2 bag play /data/${BAG:-set_BAG} --loop
      --topics ${TOPICOS:-/scan /tf /tf_static}

  percecao:
    <<: *ros
    command: >
      ros2 run va_g03 scan_to_grid --ros-args -r __ns:=/${GRUPO:-g03}
      --params-file /ws/install/va_g03/share/va_g03/config/params.yaml

  planeador:
    <<: *ros
    command: >
      ros2 run va_planeamento local_astar --ros-args -r __ns:=/${GRUPO:-g03}
      --params-file /ws/install/va_g03/share/va_g03/config/params.yaml

  gravador:
    <<: *ros
    profiles: [gravar]
    command: >
      bash -c 'exec ros2 bag record -s mcap
      -o /data/${GRUPO:-g03}_results_$$(date +%Y%m%d_%H%M%S)
      /scan /tf /tf_static
      /${GRUPO:-g03}/grelha_local /${GRUPO:-g03}/zona_proibida
      /${GRUPO:-g03}/caminho_local /${GRUPO:-g03}/estado'

  foxglove:
    <<: *ros
    profiles: [foxglove]
    ports:
      - "8765:8765"
    command: ros2 launch foxglove_bridge foxglove_bridge_launch.xml port:=8765
