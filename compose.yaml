# Group project: perception -> local occupancy grid -> local planner (A*).
# GRUPO and ROS_DOMAIN_ID come from the .env file.
#
#   docker compose build
#   docker compose --profile simulado up                -> simulated LiDAR + perception + planner
#   docker compose --profile reproduzir up              -> same, with a recorded bag (BAG=...)
#   ... --profile gravar                                -> records sensor + results into ./data
#   ... --profile foxglove                              -> foxglove_bridge (port 8765)
#   ... --profile rviz                                  -> rviz2 (Linux, X11)

x-ros: &ros
  build: .
  image: va/${GRUPO:-g03}:latest
  network_mode: host          # Linux: the container uses the laptop's network (sensors, DDS)
  ipc: host                   # required for Fast DDS between containers with host networking
  stop_signal: SIGINT         # clean Ctrl+C for the nodes and for ros2 bag
  environment:
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
    - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
  volumes:
    - ./data:/data            # in real acquisition, the external SSD is mounted here

services:
  # ----------------------------------------------------------------- data sources
  simulador:                  # simulated 2D LiDAR (to test without the car or a bag)
    <<: *ros
    profiles: [simulado]
    command: >
      ros2 run va_g03 fake_scan --ros-args
      --params-file /ws/install/va_g03/share/va_g03/config/params.yaml

  reprodutor:                 # replays a bag from ./data (only the topics in TOPICOS, see .env)
    <<: *ros
    profiles: [reproduzir]
    command: >
      ros2 bag play /data/${BAG:-set_BAG} --loop
      --topics ${TOPICOS:-/scan /tf /tf_static}

  # driver:                   # the group's real sensor driver (example: Hokuyo 2D LiDAR)
  #   <<: *ros
  #   profiles: [sensor]
  #   command: >
  #     ros2 run urg_node urg_node_driver --ros-args
  #     -p ip_address:=192.168.0.10 -p laser_frame_id:=lidar2d_frente

  # ----------------------------------------------------------------- processing
  percecao:                   # the group's node: sensor -> grelha_local
    <<: *ros
    command: >
      ros2 run va_g03 scan_to_grid --ros-args -r __ns:=/${GRUPO:-g03}
      --params-file /ws/install/va_g03/share/va_g03/config/params.yaml

  planeador:                  # shared by all: grelha_local -> caminho_local + estado
    <<: *ros
    command: >
      ros2 run va_planeamento local_astar --ros-args -r __ns:=/${GRUPO:-g03}
      --params-file /ws/install/va_g03/share/va_g03/config/params.yaml

  # ----------------------------------------------------------------- recording and visualization
  gravador:
    <<: *ros
    profiles: [gravar]
    command: >
      bash -c 'exec ros2 bag record -s mcap
      -o /data/${GRUPO:-g03}_results_$$(date +%Y%m%d_%H%M%S)
      /scan /tf /tf_static
      /${GRUPO:-g03}/grelha_local /${GRUPO:-g03}/zona_proibida
      /${GRUPO:-g03}/caminho_local /${GRUPO:-g03}/estado'

  foxglove:
    <<: *ros
    profiles: [foxglove]
    command: ros2 launch foxglove_bridge foxglove_bridge_launch.xml port:=8765

  rviz:
    <<: *ros
    profiles: [rviz]
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: rviz2 -f base_link
