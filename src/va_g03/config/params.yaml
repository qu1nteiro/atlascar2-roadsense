# Node parameters. "/**/<node>" applies to the node with that name
# in any namespace (/g03, ...).
/**/fake_scan:
  ros__parameters:
    frame_id: lidar2d_frente
    speed: 4.0
    scenario: swerve          # swerve | blocked

/**/scan_to_grid:
  ros__parameters:
    grid_frame: base_link
    resolution: 0.2
    x_min: -5.0
    x_max: 35.0
    y_min: -10.0
    y_max: 10.0
    mark_free: true

/**/local_astar:
  ros__parameters:
    rate: 5.0
    goal_x: 25.0           # local goal: 25 m ahead, lane center
    goal_y: 0.0
    inflation_radius: 1.0         # half the ATLASCAR2 width (~0.75 m) + margin
    heuristic_weight: 1.0
    unknown_is_free: true
    corridor_y_min: 0.0        # road lateral limits (m), if known;
    corridor_y_max: 0.0        # equal = disabled
    swerve_threshold: 0.3
