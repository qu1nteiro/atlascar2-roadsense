# Automatic check on every push: the image builds and the tests pass.
name: CI

on:
  push:
  pull_request:

jobs:
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker compose build
      - name: Tests (pytest inside the container)
        run: docker compose run --rm planeador python3 -m pytest -q /ws/src
